name: Build LOD_SURVIVAL

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Pack Windows
        shell: pwsh
        run: |
          npm run pack:win *> pack.log
          $exitCode = $LASTEXITCODE
          Get-Content pack.log
          if ($exitCode -ne 0) {
            Get-Content pack.log -Tail 12 | ForEach-Object { Write-Output "::error::$_" }
            exit $exitCode
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/LOD_SURVIVAL.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: Build Android APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug > gradle.log 2>&1
          exit_code=$?
          cat gradle.log
          if [ "$exit_code" -ne 0 ]; then
            tail -n 12 gradle.log | sed 's/^/::error::/'
            exit "$exit_code"
          fi
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk LOD_SURVIVAL-0.24.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LOD_SURVIVAL-0.24.2.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "LOD_SURVIVAL beta 0.24.2" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" release-assets/LOD_SURVIVAL.exe release-assets/LOD_SURVIVAL-0.24.2.apk --clobber
